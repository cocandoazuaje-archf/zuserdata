<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Usuarios - 50 registros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h3 class="mb-4">Listado Completo de Usuarios</h3>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered align-middle">

            <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Ubicación</th>
                    <th>Creado</th>
                    <th>Actualizado</th>
                </tr>
            </thead>

            <tbody id="tablaUsuarios"></tbody>

        </table>
    </div>

</div>

<!-- MODAL -->

<div class="modal fade" id="usuarioModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Detalle del Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p><strong>ID:</strong> <span id="modalId"></span></p>
                <p><strong>Nombre:</strong> <span id="modalNombre"></span></p>
                <p><strong>Email:</strong> <span id="modalEmail"></span></p>
                <p><strong>Estado:</strong> <span id="modalEstado"></span></p>
                <p><strong>Ubicación:</strong> <span id="modalUbicacion"></span></p>
                <p><strong>Creado:</strong> <span id="modalCreado"></span></p>
                <p><strong>Actualizado:</strong> <span id="modalActualizado"></span></p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cerrar
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const nombres = [
"Juan Pérez","María González","Pedro Ramírez","Ana Torres","Luis Fernández",
"Camila Rojas","Diego Morales","Valentina Soto","Javier Contreras","Francisca Vega",
"Ricardo Muñoz","Daniela Silva","Sebastián Herrera","Paula Fuentes","Andrés Castillo",
"Natalia Pizarro","Felipe Araya","Carolina Bustos","Tomás Medina","Constanza León",
"Rodrigo Peña","Ignacia Navarrete","Matías López","Isidora Martínez","Cristóbal Díaz",
"Antonia Romero","Benjamín Silva","Martina González","Agustín Morales","Josefa Rojas",
"Tomás Herrera","Emma Castillo","Vicente Soto","Florencia Vega","Emiliano Torres",
"Amparo Fernández","Lucas Ramírez","Catalina Muñoz","Ignacio Pérez","Sara González",
"Gabriel López","Emilia Díaz","Diego Castro","Agustina Silva","Matías Rojas",
"Renata Morales","Nicolás Herrera","Paola Gutiérrez","Daniel Castillo","René Bustamante"
];

const tbody = document.getElementById("tablaUsuarios");

nombres.forEach((nombre, index) => {

    const i = index + 1;
    const activo = i % 4 !== 0;
    const estado = activo ? "ACTIVE" : "INACTIVE";
    const badge = activo ? "bg-success" : "bg-danger";

    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td>${i}</td>
        <td>
            <a href="#"
               onclick="abrirModal(event,this);return false;"
               class="fw-semibold text-decoration-none">
               ${nombre}
            </a>
        </td>
        <td>usuario${i}@email.com</td>
        <td><span class="badge ${badge}">${estado}</span></td>
        <td>Santiago</td>
        <td>2026-02-18</td>
        <td>2026-02-18</td>
    `;

    tbody.appendChild(tr);
});

function abrirModal(event, link) {

    event.preventDefault();

    const fila = link.closest("tr");
    const celdas = fila.querySelectorAll("td");

    document.getElementById("modalId").textContent = celdas[0].textContent.trim();
    document.getElementById("modalNombre").textContent = link.textContent.trim();
    document.getElementById("modalEmail").textContent = celdas[2].textContent.trim();
    document.getElementById("modalEstado").innerHTML = celdas[3].innerHTML;
    document.getElementById("modalUbicacion").textContent = celdas[4].textContent.trim();
    document.getElementById("modalCreado").textContent = celdas[5].textContent.trim();
    document.getElementById("modalActualizado").textContent = celdas[6].textContent.trim();

    const modal = new bootstrap.Modal(document.getElementById("usuarioModal"));
    modal.show();
}

</script>

</body>
</html>
